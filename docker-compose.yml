version: '3.9'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: airspace-copilot-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_LOG_LEVEL=info
      - N8N_LOG_OUTPUT=console
      # Enable CORS for local development
      - N8N_CORS_ORIGIN=*
    volumes:
      # Persist n8n data (workflows, credentials, settings)
      - n8n_data:/home/node/.n8n
      # Mount local data directory for file access
      - ./data:/data
      # Mount n8n workflows directory for easy import/export
      - ./n8n_workflows:/n8n_workflows
    networks:
      - airspace-network

networks:
  airspace-network:
    driver: bridge

volumes:
  n8n_data:
    driver: local
